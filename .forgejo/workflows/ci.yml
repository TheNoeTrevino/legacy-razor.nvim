name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The specs test pure Lua logic (path parsing, resolution order) with no real
    # OS dependency, so run on Linux where PlenaryBustedDirectory is reliable -
    # on Windows CI its child-process runner hangs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz | sudo tar -xz -C /opt
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Clone plenary
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim .deps/plenary.nvim

      - name: Run specs
        run: |
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/ {minimal_init='tests/minimal_init.lua', sequential=true}"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install StyLua
        run: |
          curl -fsSL -o /tmp/stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.1.0/stylua-linux-x86_64.zip
          sudo unzip -o -q /tmp/stylua.zip -d /usr/local/bin
      - name: Check formatting
        run: stylua --check lua/ plugin/ tests/
